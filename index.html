<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jarvis" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0e17" />
  <link rel="manifest" href="manifest.json?v=5" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <title>Jarvis Glasses Assistant</title>
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
<div id="app">

  <!-- ── Header ── -->
  <header class="header">
    <div class="header__left">
      <div class="ws-dot" id="ws-dot" title="Подключение"></div>
    </div>
    <div class="header__center">
      <span class="header__title">J.A.R.V.I.S.</span>
      <span class="header__sub">Glasses Voice Assistant</span>
    </div>
    <div class="header__right">
      <button class="icon-btn" id="open-settings-btn" title="Настройка кнопок очков">⚙️</button>
      <button class="icon-btn" id="clear-btn" title="Очистить чат">🗑️</button>
    </div>
  </header>

  <!-- Gestures / Buttons Settings Modal -->
  <div id="settings-modal" class="modal" style="display: none;">
    <div class="modal__content">
      <div class="modal__header">
        <h2>⚙️ Настройка сенсоров очков</h2>
        <button id="close-settings-btn" class="modal__close">&times;</button>
      </div>
      <div class="modal__tabs">
        <button class="tab-btn tab-btn--active" data-tab="left-tab">Левая дужка</button>
        <button class="tab-btn" data-tab="right-tab">Правая дужка</button>
      </div>

      <div id="left-tab" class="tab-content tab-content--active">
        <div class="setting-row">
          <label>1 клик (Single):</label>
          <select id="sel-left_single" class="gesture-select"></select>
        </div>
        <div class="setting-row">
          <label>2 клика (Double):</label>
          <select id="sel-left_double" class="gesture-select"></select>
        </div>
        <div class="setting-row">
          <label>3 клика (Triple):</label>
          <select id="sel-left_triple" class="gesture-select"></select>
        </div>
        <div class="setting-row">
          <label>Удержание (Long):</label>
          <select id="sel-left_long" class="gesture-select"></select>
        </div>
      </div>

      <div id="right-tab" class="tab-content">
        <div class="setting-row">
          <label>1 клик (Single):</label>
          <select id="sel-right_single" class="gesture-select"></select>
        </div>
        <div class="setting-row">
          <label>2 клика (Double):</label>
          <select id="sel-right_double" class="gesture-select"></select>
        </div>
        <div class="setting-row">
          <label>3 клика (Triple):</label>
          <select id="sel-right_triple" class="gesture-select"></select>
        </div>
        <div class="setting-row">
          <label>Удержание (Long):</label>
          <select id="sel-right_long" class="gesture-select"></select>
        </div>
      </div>

      <button id="save-settings-btn" class="modal__save-btn">💾 Сохранить раскладку</button>
    </div>
  </div>

  <!-- ── Orb + status ── -->
  <section class="orb-section">
    <div class="orb-wrap">
      <div class="orb-ring" id="orb-ring"></div>
      <div class="orb" id="status-orb">
        <span class="orb-emoji" id="orb-emoji">😴</span>
      </div>
    </div>
    <p class="state-label" id="status-label">Спит</p>
    <!-- Live speech recognition feedback -->
    <div class="live-mic-feedback" id="live-mic-feedback">🎤 Нажмите «Говорить» или «👂 Авто»</div>
    <!-- ── VAD volume bar ── -->
    <div class="vad-bar" id="vad-bar" title="Уровень звука микрофона">
      <div class="vad-bar__fill" id="vad-bar-fill"></div>
    </div>
  </section>

  <!-- ── Transcript ── -->
  <section class="chat" id="chat">
    <div class="chat__inner" id="transcript-scroll">
      <div class="chat__hint" id="chat-hint">
        <p>👋 Нажмите <strong>👂 Авто</strong> — говорите в очки,<br>Джарвис ответит голосом</p>
      </div>
    </div>
  </section>

  <!-- ── Quick Chips & Text Input Bar ── -->
  <section class="quick-input-section">
    <div class="quick-chips">
      <button class="chip-btn" data-prompt="Сколько будет 15 умножить на 4?">⚡ 15 * 4</button>
      <button class="chip-btn" data-prompt="Передай агенту OpenClaw посчитать 100 минус 37">🚀 OpenClaw задача</button>
      <button class="chip-btn" data-prompt="Какой статус кандидатов в CRM I CLUB?">💼 I CLUB CRM</button>
    </div>
    <form class="text-input-form" id="chat-form">
      <input type="text" id="chat-input" class="chat-input" placeholder="Написать или сказать в очки..." autocomplete="off" />
      <button type="submit" class="send-btn" id="chat-send-btn" title="Отправить">➤</button>
    </form>
  </section>

  <!-- ── Devices row (collapsible) ── -->
  <div class="devices-row" id="devices-row">
    <div class="device-item">
      <span class="device-icon">🎤</span>
      <select id="audio-input-select" class="device-select">
        <option value="">Загрузка…</option>
      </select>
    </div>
    <div class="device-sep"></div>
    <div class="device-item">
      <span class="device-icon">🔊</span>
      <select id="audio-output-select" class="device-select">
        <option value="">Загрузка…</option>
      </select>
    </div>
  </div>

  <!-- ── Controls ── -->
  <section class="controls">
    <!-- Hands-Free (VAD) -->
    <button class="ctrl-btn ctrl-btn--hf" id="hands-free-btn" data-active="false">
      <span class="ctrl-btn__icon">👂</span>
      <span class="ctrl-btn__label">Авто</span>
    </button>

    <!-- Big mic -->
    <button class="ctrl-btn ctrl-btn--mic" id="listen-btn" data-active="false">
      <span class="ctrl-btn__icon" id="listen-icon">🎙️</span>
      <span class="ctrl-btn__label">Говорить</span>
    </button>

    <!-- Settings / devices toggle -->
    <button class="ctrl-btn ctrl-btn--settings" id="settings-btn" data-active="false">
      <span class="ctrl-btn__icon">⚙️</span>
      <span class="ctrl-btn__label">Устр.</span>
    </button>
  </section>

</div><!-- #app -->

<script type="module" src="js/app.js?v=8"></script>
</body>
</html>
